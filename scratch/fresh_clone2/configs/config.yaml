random_seed: 42
n_patients: 40
days_per_patient: 21
sampling_interval_minutes: 5
spike_threshold_mgdl: 50
prediction_horizon_minutes: 120
lookback_window_minutes: 120
glucose_target_range: [70, 180]

label_min_future_coverage: 0.8
split:
  train: 0.70
  val: 0.15
  test: 0.15

features:
  lag_minutes: [5, 15, 30, 60, 120]
  rolling_windows_minutes: [30, 60, 120]
  meal_windows_minutes: [60, 120, 240]
  activity_windows_minutes: [30, 60, 120]
  max_minutes_since_meal: 360
  max_minutes_since_activity: 720
  personal_baseline_window_hours: 24
  min_periods_fraction: 0.5
  carb_absorption_peak_minutes: 50
  carb_absorption_duration_minutes: 180
  features_path: "data/processed/features.parquet"

start_date: "2026-01-01"
glucose_min: 40
glucose_max: 400
missing_rate: 0.015
gap_probability_per_day: 0.25
meal_carbs_ranges:
  breakfast: [30, 60]
  lunch: [45, 85]
  dinner: [45, 90]
  snack: [10, 30]
resting_hr_base: 65
hr_bmi_effect: 0.5
hr_age_effect: 0.1

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  reports: reports

evaluation:
  calibration_method_candidates: ["isotonic", "sigmoid"]
  n_bootstrap: 500
  alert_cooldown_minutes: 60
  lead_time_bins_minutes: [0, 15, 30, 60, 90, 120]
  shap_background_size: 500
  shap_sample_size: 3000
  risk_band_policy:
    low_max_percentile_precision: 0.5
    high_min_precision: 0.7
  frozen_manifest_path: "models/FROZEN.json"
  test_done_path: "reports/TEST_EVAL_DONE.json"

twin:
  history_buffer_hours: 36
  warmup_hours: 24
  stale_data_minutes: 20
  min_completeness_60m: 0.6
  alert_cooldown_minutes: 60
  risk_history_hours: 48
  drivers_top_k: 3
  demo_patient_split: "test"
  state_dir: "data/twin_states"
  trend_thresholds:
    rising_fast: 2.0
    rising: 1.0
    falling: -1.0
    falling_fast: -2.0

forecast:
  horizons_minutes: [15, 30, 60, 90, 120]
  quantiles: [0.1, 0.5, 0.9]
  nominal_interval_coverage: 0.8
  tuning_trials: 3
  cv_folds: 3
  xgb_early_stopping_rounds: 10
  max_estimators: 100
  models_dir: "models"
  manifest_path: "models/FORECAST_FROZEN.json"
  test_done_path: "reports/FORECAST_TEST_DONE.json"
  hypo_threshold_mgdl: 70
  hyper_threshold_mgdl: 180
  spike_delta_mgdl: 50
  allow_last_observation_anchor: false

whatif:
  horizon_minutes: 180
  ensemble_size: 50
  param_window_days: 7
  min_meal_episodes: 3
  min_exercise_episodes: 1
  observer_gain: 0.3
  prior_strength: 1.0
  interval_inflation: 15.0
  quantiles: [0.1, 0.5, 0.9]
  hypo_threshold_mgdl: 70
  hyper_threshold_mgdl: 180
  improvement_margin_mgdl: 10
  refit_every_hours: 6
  decision_moment_cap_per_patient: 60
  manifest_path: "models/WHATIF_FROZEN.json"
  test_done_path: "reports/WHATIF_TEST_DONE.json"
  prior_path: "models/whatif_prior_v1.json"
  scenarios:
    walk_10min_after_meal:
      start_after_meal_min: 15
      duration: 10
      intensity: 1
    walk_30min_moderate:
      start_after_meal_min: 15
      duration: 30
      intensity: 2
    meal_earlier_30min:
      shift: -30
    meal_later_30min:
      shift: 30
    reduce_carbs_30pct:
      factor: 0.7
    split_meal_60min:
      first_fraction: 0.5
      gap: 60

app:
  title: "DiaTwin"
  subtitle: "Type 2 Diabetes Digital Twin - Happiest Health Digital Twin Challenge 2026 (prototype)"
  demo_patient_ids: null
  default_history_hours: 6
  forecast_hours: 2
  risk_history_hours: 48
  default_moment_strategy: "most_interesting"
  use_demo_bundle: true
  whatif_default_carbs_g: 60
  whatif_default_meal_offset_min: 20
  whatif_carbs_range: [10, 150]
  whatif_offset_range_min: [0, 120]
  activity_duration_range_min: [5, 60]
  activity_intensity_options: [1, 2]
  whatif_presets:
    - name: "Typical breakfast 50 g in 15 min"
      plan: {meal: {carbs: 50, offset_min: 15}}
      scenarios: ["baseline"]
    - name: "Large dinner 90 g in 30 min"
      plan: {meal: {carbs: 90, offset_min: 30}}
      scenarios: ["baseline", "walk_10min_after_meal"]
    - name: "No meal, walk now"
      plan: {meal: null}
      scenarios: ["baseline", "walk_30min_moderate"]
  result_cache_seconds: 3600
  ranking_min_confidence: "medium"
  palette:
    low: "#2ecc71"
    medium: "#f1c40f"
    high: "#e74c3c"
    glucose: "#3498db"
    forecast_band: "rgba(52, 152, 219, 0.2)"
    target_range: "rgba(189, 195, 199, 0.3)"
    meal: "#9b59b6"
    activity: "#e67e22"
    actual_overlay: "#95a5a6"
  scenario_colors:
    baseline: "#34495e"
    walk_10min_after_meal: "#1abc9c"
    walk_30min_moderate: "#16a085"
    meal_earlier_30min: "#2980b9"
    meal_later_30min: "#8e44ad"
    reduce_carbs_30pct: "#c0392b"
    split_meal_60min: "#d35400"
    custom: "#f39c12"
  disclaimer: "Educational prototype with synthetic data. Not a medical device. Not for clinical decisions."
  insights_bundle_path: "reports/insights_bundle.json"
  team_name: null
  team_members: []
  repo_url: null
  contact_email: null
  demo_video_url: null
  challenge_name: "Happiest Health Digital Twin Challenge 2026"
  guided_demo_steps:
    - step: 1
      page: "Patient List"
      patient_rule: "View the overall cohort summary"
      look_at: "Overall metrics and search/filter for patients with different risk bands"
    - step: 2
      page: "Live Twin"
      patient_rule: "Select P007 (or any default demo patient)"
      look_at: "Glucose forecast chart with uncertainty bands and active alerts"
    - step: 3
      page: "Live Twin"
      patient_rule: "Stay on the same patient"
      look_at: "Top risk drivers and data quality/completeness badges"
    - step: 4
      page: "What-if Simulator"
      patient_rule: "Click 'Try a what-if at this moment' from Live Twin"
      look_at: "Compare 'Baseline' with 'Walk 30min' and 'Reduce carbs' scenarios"
    - step: 5
      page: "Model Insights"
      patient_rule: "No specific patient required"
      look_at: "Global SHAP feature importance, and performance on the test set"
  section_order:
    - "Risk model"
    - "Calibration and bands"
    - "Why the model predicts"
    - "Does fusion help?"
    - "Clinical usefulness"
    - "Forecast"
    - "What-if validation"
    - "Where it struggles"
    - "Integrity and reproducibility"
  glossary:
    - term: "digital twin"
      definition: "A virtual representation of a patient's state, continually updated with new data."
    - term: "EHR"
      definition: "Electronic Health Record, containing static or slowly changing clinical history."
    - term: "wearable"
      definition: "Devices like smartwatches or fitness trackers that continuously monitor metrics like heart rate or steps."
    - term: "CGM"
      definition: "Continuous Glucose Monitor, a device that records blood glucose levels frequently."
    - term: "HbA1c"
      definition: "A measure of average blood sugar levels over the past 2-3 months."
    - term: "time in range"
      definition: "The percentage of time a patient's glucose levels remain within a target range (typically 70-180 mg/dL)."
    - term: "calibration"
      definition: "Adjusting model probabilities so they align with actual observed frequencies of an event."
    - term: "ROC-AUC"
      definition: "Area Under the Receiver Operating Characteristic curve; measures ability to rank risks correctly."
    - term: "PR-AUC"
      definition: "Area Under the Precision-Recall curve; especially useful for imbalanced datasets."
    - term: "SHAP"
      definition: "SHapley Additive exPlanations; a method to explain individual predictions by attributing credit to features."
    - term: "conformal prediction"
      definition: "A statistical method that provides reliable confidence intervals around predictions."
    - term: "what-if simulation"
      definition: "Forecasting outcomes under hypothetical interventions (e.g., changing meal timing or exercising)."
    - term: "carbs on board"
      definition: "An estimate of the remaining active carbohydrates from recent meals."
    - term: "patient-wise split"
      definition: "Splitting data so that all records from a given patient appear in only one split (train, val, or test)."
    - term: "synthetic data"
      definition: "Artificially generated data that mimics real-world properties without exposing actual patient records."
